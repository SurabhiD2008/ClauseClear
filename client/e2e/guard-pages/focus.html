<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus</title>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <main>
      <h1>Focus</h1>
      <p><button type="button" class="cc-tap no-ring">No ring</button></p>
      <p><button type="button" class="cc-tap invisible">Invisible</button></p>
      <p><input type="text" class="cc-tap trap" aria-label="Trap" /></p>
      <p><button type="button" class="cc-tap">After the trap</button></p>
    </main>
    <script src="focus.js"></script>
  </body>
</html>
